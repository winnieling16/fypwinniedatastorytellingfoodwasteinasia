<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introduction - Food Waste Crisis</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* --- Layout & Background Video Layering --- */
        #intro_body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            font-family: 'serif';
        }

        .intro_word {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        /* The background loop video (Underneath) */
        #bgVideo {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: 1;
            transform: translate(-50%, -50%);
            object-fit: cover;
            transition: opacity 1.5s ease-in-out;
        }

        /* Foreground Story Video (Your previous container) */
        .video_container {
            width: 100%;
            height: auto;
            max-height: 100vh;
            object-fit: contain;
            background-color: black;
            position: relative;
            z-index: 20; 
            display: none;
            opacity: 1; 
        }

        /* Intro Overlay UI */
        .overlay_text {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            color: white;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            padding: 40px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 80%;
            max-width: 800px;
            transition: opacity 1s ease;
        }

        .story-label {
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #ffff02;
        }

        .main-title {
            font-size: 2.2em;
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }

        /* --- Transitions & Buttons --- */
        .fade-out-content {
            opacity: 0 !important;
            pointer-events: none;
        }

        .fade-in {
            display: block !important;
            opacity: 1 !important;
            /* visibility: visible !important; */
            /* transition: opacity 1s ease, visibility 1s ease; */
        }

        .fade-in-arrow {
            opacity: 1 !important;
            transition: opacity 1.5s ease;
        }

        .hidden {
            opacity: 0;
            /* visibility: hidden; */
            display: none;
            transition: opacity 1s ease;
        }

        .continue_btn {
            position: absolute;
            top: 65%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 11;
            padding: 15px 35px;
            background-color: #0fa091;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1.1em;
            transition: background 0.3s, opacity 1s;
        }

        /* --- Reverted Text Section (Original Styling) --- */
        #blackOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            z-index: 998;
        }

        #questionText {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            z-index: 999;
            width: auto;
            max-width: 90%;
            /* Original size logic */
        }

        .scrollCue {
            width: 80px;
            cursor: pointer;
            margin: 30px auto;
            display: block;
        }
    </style>
</head>
<body id="intro_body">

    <section class="intro_word">
        <video autoplay muted loop playsinline id="bgVideo">
            <source src="index_bg.mp4" type="video/mp4">
        </video>

        <div class="overlay_text" id="overlayText">
            <span class="story-label">Story Title:</span><br>
            <span class="main-title">Bringing The Food Waste Crisis To Life Using Data Storytelling</span>
        </div>

        <button class="continue_btn" id="introBtn" onclick="playVideo()">Click to continue</button>

        <video id="videoContainer" class="video_container" muted playsinline preload="auto">
            <source src="intro_video.mp4" type="video/mp4">
        </video>

        <div id="blackOverlay" class="hidden"></div>
        
        <div id="questionText" class="hidden">
            <p>It looks small, but every small waste adds up… <br> Can you make better choices?</p>
            <div class="question_btns">
                <button class="continue_qbtn" onclick="handleAnswer('Yes')">Yes</button>
                <button class="continue_qbtn" onclick="handleAnswer('Maybe')">Maybe</button>
                <button class="continue_qbtn" onclick="handleAnswer('No')">No</button>
            </div>
            <div id="microText" class="micro_text hidden">Let's find out together.</div>
        </div>

        <div id="scrollOverlay" class="hidden">
            <img src="Scroll Down Arrow.gif" alt="Scroll down" class="scrollCue hidden">
        </div>

        <audio id="bgm" src="landfill.mp3"></audio>
    </section>

    <script>
        const bgVideo = document.getElementById('bgVideo');
        const video = document.getElementById("videoContainer");
        const overlay_text = document.getElementById("overlayText");
        const button = document.querySelector(".continue_btn");
        const scrollOverlay = document.getElementById("scrollOverlay");
        const scrollArrow = document.querySelector(".scrollCue");
        const blackOverlay = document.getElementById("blackOverlay");
        const questionText = document.getElementById("questionText");
        const microText = document.getElementById("microText");
        const bgm = document.getElementById("bgm");

        function playVideo() {
            // Fade out intro background loop and title card
            bgVideo.classList.add('fade-out-content');
            overlay_text.classList.add('fade-out-content');
            button.classList.add('fade-out-content');

            setTimeout(() => {
                // Hide them fully and show main story video
                bgVideo.style.display = "none";
                overlay_text.style.display = "none";
                button.style.display = "none";

                // Reverting background to transparent as per original logic
                document.body.style.backgroundColor = "transparent";

                video.style.display = "block";
                video.setAttribute("controls", "true");
                video.muted = false;
                video.play();
            }, 1500);
        }

        video.addEventListener('ended', () => {
            // Logic from your provided previous text section
            blackOverlay.classList.remove('hidden');
            questionText.classList.remove('hidden');

            blackOverlay.classList.add('fade-in');
            questionText.classList.add('fade-in');
            
            bgm.play();
        });

        function handleAnswer(answer) {
            console.log("User answered:", answer);
            const questionBtns = document.querySelector(".question_btns"); 
            questionBtns.style.display = 'none';

            // Show Micro Text (Original logic)
            microText.classList.remove("hidden");
            microText.classList.add("fade-in");

            // Show scroll arrow after a short delay
            setTimeout(() => {
                scrollOverlay.classList.remove("hidden");
                scrollOverlay.classList.add("fade-in");
                scrollArrow.classList.remove("hidden");
                scrollArrow.classList.add("fade-in-arrow");
            }, 2500);
        }

        scrollOverlay.addEventListener('click', () => {
            window.location.href = "ink_transition.html";
        });
    </script>
</body>
</html>
